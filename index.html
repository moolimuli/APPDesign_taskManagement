/* Fixed-height app layout and larger, neutral UI typography */
html,body{height:100%;overflow:hidden}
body{font-size:15px}
#appShell{height:100vh;height:100dvh;min-height:0;grid-template-rows:minmax(0,1fr);overflow:hidden}
#appShell>.sidebar{height:100%;min-height:0;position:sticky;top:0;overflow-y:auto;overscroll-behavior:contain}
#appShell>main{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:24px 28px}
#appShell .topline,#appShell .heading-row{flex:none}
#appShell .topline{margin-bottom:18px}
#appShell:not(.task-view) .schedule{display:flex;flex:1;flex-direction:column;min-height:0;overflow:hidden;margin-top:18px}
#appShell .schedule>.section-title,#appShell .schedule>.daybar{flex:none}
#calendarArea{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
#appShell.task-view>main{display:grid;grid-template-rows:auto auto minmax(0,1fr)}
#appShell.task-view main #taskPage{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;overflow:hidden;margin-top:20px}
#categoryGroups{min-height:0;overflow-y:auto;overflow-x:hidden;align-content:start;grid-auto-rows:max-content;gap:14px;padding:0 4px 8px 0;overscroll-behavior:contain;scrollbar-gutter:stable;-webkit-overflow-scrolling:touch}
#appShell .category-footer{flex:none;margin-top:12px}
#appShell>.rightbar{height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:24px 20px}
#appShell.task-view>.rightbar{display:none}
#appShell .rightbar>.right-head:first-child,#appShell .rightbar>.quick-box{flex:none}
#appShell .rightbar>.right-head:first-child{margin-bottom:14px}
#appShell .rightbar>.quick-box{margin-bottom:18px}
#appShell .task-panel{display:flex;flex:1;flex-direction:column;min-height:0;overflow:hidden}
#appShell .task-panel>.right-head{flex:none;margin-bottom:10px}
#taskList{flex:1;min-height:0;overflow-y:auto;align-content:start;gap:12px;padding:1px 5px 12px 0;overscroll-behavior:contain;scrollbar-gutter:stable}
#appShell .category-legend{flex:none;max-height:36vh;overflow-y:auto;margin-top:12px;padding-top:16px;overscroll-behavior:contain}
#appShell .category-groups,#taskList{scrollbar-color:#c8cecb #f4f5f4;scrollbar-width:thin}
#appShell *{font-size:15px}
#appShell .crumb,#appShell .nav-count,#appShell .brand-sub,#appShell .account-menu-email,#appShell .stat span,#appShell .section-title span,#appShell .hour-label,#appShell .event-time,#appShell .event-meta,#appShell .date-control .today-link,#appShell .text-btn,#appShell .completed-toggle,#appShell .completed-toggle span,#appShell .task-details,#appShell .task-details .tag,#appShell .priority,#appShell .empty,#appShell .category-count,#appShell .category-arrow,#appShell .category-legend h3,#appShell .legend-row,#appShell .week-time span,#appShell .week-dayhead,#appShell .week-dayhead strong,#appShell .week-unscheduled,#appShell .week-unscheduled-item,#appShell .cal-head,#appShell .cal-daynum,#appShell .cal-more,#appShell .field label{font-size:13px}
#appShell .heading-row h1{font-size:26px}
#appShell .section-title h2,#appShell .right-head h2,#appShell .category-legend h3,#appShell .category-group-head{font-size:17px}
#appShell .task-title,#appShell .event-title{font-size:15px}
#appShell .task-details>span:not(.tag):not(.priority),#appShell .legend-row span{font-size:13px}
#appShell .category-name{font-size:17px}
#appShell .category-group-head{padding:15px 18px}
#appShell .category-group-body{gap:12px;padding:0 16px 16px}
#appShell .category-group-body[hidden]{display:none}
#appShell .category-count,#appShell .legend-row,#appShell .completed-toggle{font-size:13px}
#appShell .task{min-height:62px;padding:12px 16px;border-radius:12px}
#appShell .task-details{flex-wrap:wrap;gap:8px}
#appShell .task-list{gap:12px}
#appShell .task-delete{font-size:17px}
#appShell .quick-box{border-radius:12px;padding:14px 16px}
#appShell .group-add,#appShell .category-footer{min-height:48px;padding:12px 16px;border-radius:12px}
#appShell .week-schedule{grid-template-columns:60px repeat(7,minmax(140px,1fr))}
#appShell .week-col{min-width:140px}
#appShell .week-schedule>.week-col:first-child{width:60px;min-width:0}
#appShell .week-unscheduled{display:none}
#appShell .week-time{height:82px}
#appShell .week-daybody{height:984px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 81px,#f0f2f0 81px,#f0f2f0 82px)}
#appShell .week-event{min-height:56px;padding:12px 16px;border-radius:10px}
#appShell .week-event .event-title{font-size:15px;line-height:1.3}

(()=>{

async function handleAuthChange(user){const token=++cloudLoadToken;cloudReadyUserId=null;if(!user){resetToLogin();return}currentUser=user;tasks=[];categories=[];setAuthUI(user);showLoginGate('正在載入雲端資料…','載入中…',true);try{const data=await loadUserData(user.uid);if(token!==cloudLoadToken||currentUser?.uid!==user.uid)return;if(data){tasks=Array.isArray(data.tasks)?data.tasks:[];categories=Array.isArray(data.categories)?data.categories:[...DEFAULT_CATEGORIES]}else{tasks=[];categories=[...DEFAULT_CATEGORIES];await saveUserData(user.uid,{tasks,categories});if(token!==cloudLoadToken||currentUser?.uid!==user.uid)return}cloudReadyUserId=user.uid;update();$('#authGate').hidden=true;$('#appShell').hidden=false;$('#assistantLauncher').hidden=false}catch(e){if(token!==cloudLoadToken)return;cloudReadyUserId=null;showLoginGate('無法載入雲端資料，請重試。','重試載入',false);toast('讀取雲端資料失敗：'+e.message)}}

function closeAssistantPanel(){assistantRequestToken++;assistantProposalPending=false;setAssistantBusy(false);clearTimeout(assistantCloseTimer);assistantCloseTimer=null;const panel=$('#assistantPanel');panel.classList.remove('open');panel.setAttribute('aria-hidden','true');$('#assistantBackdrop').hidden=true;$('#assistantMessages').replaceChildren();$('#assistantQuestion').value='';clearConversation();if(panel.hidden)return;assistantCloseTimer=setTimeout(()=>{panel.hidden=true;assistantCloseTimer=null},260)}
function openAssistantPanel(){if($('#assistantLauncher').hidden)return;clearTimeout(assistantCloseTimer);assistantCloseTimer=null;const panel=$('#assistantPanel');panel.hidden=false;$('#assistantBackdrop').hidden=false;panel.setAttribute('aria-hidden','false');$('#assistantMessages').replaceChildren();$('#assistantQuestion').value='';assistantProposalPending=false;setAssistantBusy(false);requestAnimationFrame(()=>panel.classList.add('open'));try{startConversation()}catch(error){console.error('AI 對話初始化失敗：',{code:error?.code??'',message:error?.message??String(error),error});appendAssistantBubble('assistant',assistantErrorMessage(error))}setTimeout(()=>$('#assistantQuestion').focus(),80)}
async function sendAssistantQuestion(value=$('#assistantQuestion').value){const question=value.trim();if(!question||assistantBusy||assistantProposalPending)return;if(Date.now()<assistantCooldownUntil){updateAssistantControls();return}const requestToken=++assistantRequestToken;startAssistantCooldown();appendAssistantBubble('user',question);$('#assistantQuestion').value='';setAssistantBusy(true);const thinking=appendAssistantBubble('assistant','思考中…','thinking');try{const answer=await askAssistant(question,tasks,today,categories);if(requestToken!==assistantRequestToken)return;thinking.remove();if(answer?.usedFallback)appendAssistantBubble('assistant','主要模型暫時無法回覆，已切換備援模型。');if(answer?.type==='create-task-proposal')appendAssistantCreateProposal(answer.task);else appendAssistantBubble('assistant',answer?.text||'目前無法取得回覆，請再試一次。')}catch(error){console.error('AI 小幫手回覆失敗：',{code:error?.code??'',message:error?.message??String(error),error});if(requestToken!==assistantRequestToken)return;thinking.remove();appendAssistantBubble('assistant',assistantErrorMessage(error))}finally{if(requestToken===assistantRequestToken)setAssistantBusy(false)}}
$('#assistantLauncher').onclick=openAssistantPanel;$('#assistantClose').onclick=closeAssistantPanel;$('#assistantBackdrop').onclick=closeAssistantPanel;
$$('.ai-assistant-shortcut').forEach(button=>button.onclick=()=>sendAssistantQuestion(button.dataset.assistantQuestion));
$('#assistantForm').onsubmit=event=>{event.preventDefault();sendAssistantQuestion()};
$('#assistantQuestion').onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAssistantQuestion()}};

$('#loginButton').onclick=async()=>{if(!isConfigured){showLoginGate('Firebase 尚未設定','使用 Google 登入',true);return}const button=$('#loginButton');button.disabled=true;try{if(currentUser)await handleAuthChange(currentUser);else await signInWithGoogle()}catch(e){showLoginGate('登入失敗，請重試。','使用 Google 登入',false);toast('登入失敗：'+e.message)}finally{if(!currentUser||cloudReadyUserId!==currentUser.uid)button.disabled=false}};
function setAccountMenuOpen(open){$('#accountMenu').hidden=!open;$('#avatarButton').setAttribute('aria-expanded',String(open))}
$('#avatarButton').onclick=()=>setAccountMenuOpen($('#accountMenu').hidden);$('#menuSignOut').onclick=async()=>{const button=$('#menuSignOut');button.disabled=true;setAccountMenuOpen(false);closeAssistantPanel();$('#assistantLauncher').hidden=true;showLoginGate('正在儲存並登出…','處理中…',true);try{await flushPendingCloudSave();await signOutUser();resetToLogin()}catch(e){$('#appShell').hidden=false;$('#authGate').hidden=true;$('#assistantLauncher').hidden=false;if(pendingCloudSave)save();toast('登出未完成：'+e.message)}finally{button.disabled=false}};document.addEventListener('click',e=>{if(!$('#accountArea').contains(e.target))setAccountMenuOpen(false)});
if(isConfigured)onAuthStateChanged(auth,user=>handleAuthChange(user));else resetToLogin('Firebase 尚未設定');
$('#allTasksBtn').onclick=()=>{$('[data-view="inbox"]').click()};$('#sortBtn').onclick=()=>toast('待辦依優先度排序');
})();
</script>
</body>
