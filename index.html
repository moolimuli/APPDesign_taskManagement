;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#42584b}.cal-event.personal{background:#fbf0e9;border-color:var(--orange)}.cal-event.todo{background:#f4f5f2;border-color:#9cac9f}.cal-cell.selected{background:#f5faf6}.cal-more{font-size:9px;color:#89948e;padding-left:4px}.modal-actions{display:flex;justify-content:space-between;margin-top:20px}.delete-btn{background:none;color:#c26b51;font-size:11px}.modal-actions .primary{padding:10px 18px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#243c32;color:white;border-radius:9px;padding:10px 15px;font-size:12px;transition:.25s;pointer-events:none;z-index:20;display:flex;align-items:center;gap:12px}.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}.toast-undo{padding:5px 8px;border-radius:6px;background:#fff;color:#286b55;font-size:11px;font-weight:600}.toast-undo:hover{background:#e7f1ec}

@media(max-width:1100px){.app{grid-template-columns:210px minmax(460px,1fr)}.rightbar{grid-column:2;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:0 22px;padding:25px 35px}.rightbar>.right-head,.rightbar>.quick-box{grid-column:1/-1}.later{margin-top:0}}@media(max-width:760px){.app{display:block}.sidebar{display:none}main{padding:25px 18px 35px}.rightbar{display:block;padding:24px 18px}.cal-cell{min-height:75px;padding:4px}.cal-event{font-size:8px;padding:3px}.week-grid .cal-cell{min-height:70px}.heading-row h1{font-size:26px}.stats{gap:7px}.stat{padding:12px 10px}.event{left:57px}.hour-line,.now-line{left:45px}.hour-label{font-size:9px}.topline{margin-bottom:25px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}

<body>
<div class="app" id="appShell" hidden>
<aside class="sidebar">
  <div class="brand"><div class="brand-icon">◷</div><div><div class="brand-name">日序</div><div class="brand-sub">DAYFLOW</div></div></div>
  <div class="nav-label">工作空間</div>
  <nav class="nav"><button class="active" data-view="today"><span class="nav-icon">◷</span>行程總覽</button><button data-view="inbox"><span class="nav-icon">▤</span>所有任務<span class="nav-count" id="allCount">0</span></button></nav>
  <div class="nav-label">分類</div><nav class="nav" id="categoryNav"></nav>
  <div class="side-bottom"><div class="storage-note" id="storageNote">資料同步至 Firebase</div></div>
</aside>
<main>
  <div class="topline"><div class="crumb">工作空間　/　<b id="crumbText">今日安排</b></div><div class="top-actions"><div class="account-area" id="accountArea"><button class="avatar" id="avatarButton" type="button" aria-label="帳號選單" aria-expanded="false"><img id="avatarPhoto" alt="" hidden><span id="avatarInitial">U</span></button><div class="account-menu" id="accountMenu" hidden><div class="account-menu-name" id="menuName"></div><div class="account-menu-email" id="menuEmail"></div><button class="account-menu-signout" id="menuSignOut" type="button">登出</button></div></div></div></div>
  <div class="heading-row"><h1 id="pageTitle">早安，今天也從容開始。</h1><button class="primary" id="addTask"><span class="add-plus">＋</span>詳細新增</button></div>
  <section class="schedule"><div class="section-title"><h2 id="scheduleTitle">行程安排</h2></div><div class="daybar"><div class="date-control"><button class="date-arrow" id="prevDay">‹</button><strong id="displayDate"></strong><button class="date-arrow" id="nextDay">›</button><button class="today-link" id="todayLink">今天</button></div><div class="view-switch"><button data-calendar-view="day" class="active">日</button><button data-calendar-view="week">週</button><button data-calendar-view="month">月</button></div></div><div id="calendarArea"><div class="timeline" id="timeline"></div></div></section>
</main>
<aside class="rightbar">
  <div class="right-head"><h2 id="taskHeading">當日任務</h2><button class="text-btn" id="allTasksBtn">所有任務 →</button></div>
  <div class="quick-box"><div class="quick-input"><button class="quick-plus" id="quickDetails" type="button" aria-label="詳細新增">＋</button><input id="quickTitle" placeholder="新增任務，按 Enter 快速記下…" maxlength="100" /></div></div>
  <div><div class="right-head"><h2>任務清單</h2><button class="text-btn" id="sortBtn">優先度 ↓</button></div><div class="task-list" id="taskList"></div></div>
</aside>
</div>
<div class="auth-gate" id="authGate" aria-live="polite">
  <section class="auth-card">
    <div class="auth-brand"><div class="auth-brand-icon">◷</div><div class="auth-brand-name">日序</div></div>
    <p class="auth-message" id="authMessage">正在確認登入狀態…</p>
    <button class="primary auth-login-button" id="loginButton" type="button" disabled>使用 Google 登入</button>
  </section>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h2 id="modalTitle">新增任務</h2><button class="close" id="closeModal">×</button></div><form id="taskForm"><div class="form-grid">
<div class="field full"><label for="fTitle">任務名稱 *</label><input id="fTitle" required maxlength="100" placeholder="例如：整理本週專案進度" /></div>
<div class="field"><label for="fCategory">分類</label><div class="category-controls"><select id="fCategory"><option value="">未分類</option></select><input id="newCategory" placeholder="＋ 新增分類" maxlength="20" /></div></div>
<div class="field"><label for="fDate">日期</label><input id="fDate" type="date" /></div>
<div class="field"><label>開始時間（選填）</label><div style="display:flex;gap:7px"><input id="fStart" type="time" aria-label="開始時間" /><input id="fEnd" type="time" aria-label="結束時間" /></div></div>
<div class="field"><label for="fPriority">優先度</label><select id="fPriority"><option value="medium">中</option><option value="high">高</option><option value="low">低</option></select></div>
<div class="field full"><label for="fNote">備註</label><textarea id="fNote" placeholder="補充說明、連結或想法…"></textarea></div>
</div><div class="modal-actions"><button type="button" class="delete-btn" id="deleteTask" style="visibility:hidden">刪除此任務</button><button type="submit" class="primary">儲存任務</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script type="module">
import { isConfigured, auth, onAuthStateChanged, signInWithGoogle, signOutUser, loadUserData, saveUserData } from "./scripts/firebase.js";
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
try{localStorage.removeItem('dayflow_tasks');localStorage.removeItem('dayflow_categories')}catch{}
const fmtDate=(d,opts={weekday:'long',month:'long',day:'numeric'})=>new Intl.DateTimeFormat('zh-TW',opts).format(d);
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const today=iso(new Date());
const DEFAULT_CATEGORIES=['產品專案','溝通協作','生活','休息'];
let tasks=[],categories=[...DEFAULT_CATEGORIES];
let selectedDate=today,view='today',filterType='',editingId=null,calendarView='day',currentUser=null,cloudLoadToken=0,cloudReadyUserId=null,saveTimer=null,pendingCloudSave=null,cloudSavePromise=null,completedExpanded=false,lastValidTimeDuration=null,deletedTaskForUndo=null,toastTimer=null;
const save=()=>{const uid=currentUser?.uid;if(!uid||cloudReadyUserId!==uid)return;clearTimeout(saveTimer);pendingCloudSave={uid,data:{tasks:tasks.map(task=>({...task})),categories:[...categories]}};saveTimer=setTimeout(()=>{saveTimer=null;persistPendingCloudSave().catch(e=>toast('雲端同步失敗：'+e.message))},350)};
async function persistPendingCloudSave(){if(cloudSavePromise){await cloudSavePromise;return persistPendingCloudSave()}const pending=pendingCloudSave;if(!pending)return;cloudSavePromise=(async()=>{await saveUserData(pending.uid,pending.data);if(pendingCloudSave===pending)pendingCloudSave=null})();try{await cloudSavePromise}finally{cloudSavePromise=null}if(pendingCloudSave)return persistPendingCloudSave()}
async function flushPendingCloudSave(){clearTimeout(saveTimer);saveTimer=null;await persistPendingCloudSave()}
function showLoginGate(message,buttonText='使用 Google 登入',disabled=!isConfigured){$('#appShell').hidden=true;$('#authGate').hidden=false;$('#authMessage').textContent=message;$('#loginButton').textContent=buttonText;$('#loginButton').disabled=disabled}
function setAuthUI(user){const name=user.displayName||user.email||'已登入';$('#menuName').textContent=name;$('#menuEmail').textContent=user.email||'';$('#avatarInitial').textContent=Array.from(name.trim())[0]||'U';const photo=$('#avatarPhoto');photo.onerror=()=>{photo.hidden=true;$('#avatarInitial').hidden=false};if(user.photoURL){photo.src=user.photoURL;photo.hidden=false;$('#avatarInitial').hidden=true}else{photo.removeAttribute('src');photo.hidden=true;$('#avatarInitial').hidden=false}$('#storageNote').textContent='資料同步至 Firebase'}
function resetToLogin(message=isConfigured?'請使用 Google 登入以繼續':'Firebase 尚未設定'){clearTimeout(saveTimer);saveTimer=null;pendingCloudSave=null;currentUser=null;cloudReadyUserId=null;tasks=[];categories=[];showLoginGate(message,'使用 Google 登入',!isConfigured)}
async function handleAuthChange(user){const token=++cloudLoadToken;cloudReadyUserId=null;if(!user){resetToLogin();return}currentUser=user;tasks=[];categories=[];setAuthUI(user);showLoginGate('正在載入雲端資料…','載入中…',true);try{const data=await loadUserData(user.uid);if(token!==cloudLoadToken||currentUser?.uid!==user.uid)return;if(data){tasks=Array.isArray(data.tasks)?data.tasks:[];categories=Array.isArray(data.categories)?data.categories:[...DEFAULT_CATEGORIES]}else{tasks=[];categories=[...DEFAULT_CATEGORIES];await saveUserData(user.uid,{tasks,categories});if(token!==cloudLoadToken||currentUser?.uid!==user.uid)return}cloudReadyUserId=user.uid;update();$('#authGate').hidden=true;$('#appShell').hidden=false}catch(e){if(token!==cloudLoadToken)return;cloudReadyUserId=null;showLoginGate('無法載入雲端資料，請重試。','重試載入',false);toast('讀取雲端資料失敗：'+e.message)}}
const sortTasks=a=>a.sort((x,y)=>({high:0,medium:1,low:2}[x.priority]-({high:0,medium:1,low:2}[y.priority])||(x.start||'99:99').localeCompare(y.start||'99:99')));
function update(){
 const d=new Date(selectedDate+'T12:00:00');
 $('#displayDate').textContent=calendarView==='day'?fmtDate(d,{month:'long',day:'numeric',weekday:'short'}):calendarView==='week'?(()=>{let mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));let sun=new Date(mon);sun.setDate(mon.getDate()+6);return `${fmtDate(mon,{month:'short',day:'numeric'})} – ${fmtDate(sun,{month:'short',day:'numeric'})}`})():fmtDate(d,{year:'numeric',month:'long'});
 const dayTasks=tasks.filter(t=>t.date===selectedDate),baseTasks=view==='inbox'?tasks:dayTasks,visible=filterType?(filterType==='__uncategorized'?baseTasks.filter(t=>!t.category):baseTasks.filter(t=>t.category===filterType)):baseTasks;
 
 $('#allCount').textContent=tasks.filter(t=>!t.done).length;renderCategoryNav();
 $('#taskHeading').textContent=view==='inbox'?(filterType?(filterType==='__uncategorized'?'未分類':'「'+filterType+'」')+'任務':'所有任務'):(selectedDate===today?'當日任務':'所選日期任務');
 $('#scheduleTitle').textContent=calendarView==='day'?'當日時間軸':calendarView==='week'?'每週行程':'每月行程';
 const area=$('#calendarArea');
 if(calendarView==='day'){
  area.innerHTML='<div class="timeline" id="timeline"></div>';$('#timeline').innerHTML=Array.from({length:12},(_,i)=>`<div class="hour"><span class="hour-label">${String(i+8).padStart(2,'0')}:00</span><div class="hour-line"></div></div>`).join('');
  visible.filter(t=>t.start).forEach(t=>{let [h,m]=t.start.split(':').map(Number),minute=h*60+m-480;if(minute<0||minute>=720)return;let end=t.end||t.start,[eh,em]=end.split(':').map(Number),dur=Math.max(40,eh*60+em-h*60-m),el=document.createElement('div');el.className='event '+'';el.style.top=(minute/60*65+1)+'px';el.style.height=Math.max(43,dur/60*65-4)+'px';el.innerHTML=`<div><div class="event-title">${esc(t.title)}</div><div class="event-meta">${esc(t.category||'未分類')}${t.note?' · '+esc(t.note):''}</div></div><div class="event-time">${t.start}${t.end?' – '+t.end:''}</div>`;el.title='點擊編輯';el.onclick=()=>openEdit(t.id);$('#timeline').append(el)});
  const now=new Date();if(selectedDate===today&&now.getHours()>=8&&now.getHours()<20){let line=document.createElement('div');line.className='now-line';line.style.top=((now.getHours()*60+now.getMinutes()-480)/60*65)+'px';$('#timeline').append(line)}
 }else renderCalendar(calendarView,area);
 const unscheduled=visible.filter(t=>!t.start),list=sortTasks(unscheduled.filter(t=>!t.done)),completed=sortTasks(unscheduled.filter(t=>t.done));let taskListHTML=list.length?list.map(taskHTML).join(''):'<div class="empty">這一天目前沒有未完成的未排時間待辦。</div>';if(completed.length)taskListHTML+=`<div class="completed-section"><button class="completed-toggle" id="completedToggle" type="button" aria-expanded="${completedExpanded}">已完成（${completed.length}）<span>${completedExpanded?'收合':'展開'}</span></button>${completedExpanded?`<div class="completed-list">${completed.map(taskHTML).join('')}</div>`:''}</div>`;$('#taskList').innerHTML=taskListHTML;
 $$('#taskList .check').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleDone(b.dataset.id)});$$('#taskList .task-delete').forEach(b=>b.onclick=e=>{e.stopPropagation();deleteTaskById(b.dataset.id)});$$('#taskList .task').forEach(el=>el.onclick=e=>{if(e.target.closest('button'))return;openEdit(el.dataset.id)});if($('#completedToggle'))$('#completedToggle').onclick=()=>{completedExpanded=!completedExpanded;update()};

 $('#pageTitle').textContent=view==='today'?(selectedDate===today?'早安，今天也從容開始。':fmtDate(d,{month:'long',day:'numeric'})+' 的安排'):filterType?filterType+'任務':'所有任務';$('#crumbText').textContent=view==='today'?'行程總覽':filterType?filterType+'任務':'所有任務';
}
function renderCategoryNav(){const nav=$('#categoryNav');if(!nav)return;nav.innerHTML=categories.map(c=>`<button data-filter="${esc(c)}" class="${filterType===c?'active':''}"><span class="nav-icon">◆</span>${esc(c)}<span class="nav-count">${tasks.filter(t=>t.category===c&&!t.done).length}</span></button>`).join('')+'<button data-filter="__uncategorized" class="'+(filterType==='__uncategorized'?'active':'')+'"><span class="nav-icon">◇</span>未分類</button>';$$('#categoryNav button').forEach(b=>b.onclick=()=>{filterType=b.dataset.filter==='__uncategorized'?'__uncategorized':b.dataset.filter;view='inbox';update()})}
function renderCalendar(mode,area){let base=new Date(selectedDate+'T12:00:00'),days=[];if(mode==='week'){let offset=(base.getDay()+6)%7;let monday=new Date(base);monday.setDate(base.getDate()-offset);days=Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(monday.getDate()+i);return d});let html='<div class="week-schedule"><div class="week-col"><div class="week-dayhead">時間</div>'+Array.from({length:12},(_,i)=>`<div class="week-time"><span>${String(i+8).padStart(2,'0')}:00</span></div>`).join('')+'</div>'+days.map(d=>{let key=iso(d),ev=tasks.filter(t=>t.date===key&&t.start).map(t=>{let [h,m]=t.start.split(':').map(Number),[eh,em]=(t.end||t.start).split(':').map(Number),top=(h*60+m-480)/60*65,height=Math.max(35,(eh*60+em-h*60-m)/60*65-3);if(top<0||top>780)return '';return `<div class="week-event" data-task="${t.id}" style="top:${top}px;height:${height}px"><div class="event-title">${esc(t.title)}</div><div class="event-time">${t.start}${t.end?'–'+t.end:''}</div></div>`}).join('');return `<div class="week-col"><div class="week-dayhead ${key===today?'today':''}" data-date="${key}">${['日','一','二','三','四','五','六'][d.getDay()]}<strong>${d.getDate()}</strong></div><div class="week-daybody" data-date="${key}">${ev}</div></div>`}).join('')+'</div><div class="week-unscheduled"><strong>未排時間的待辦</strong><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px">'+days.map(d=>{let key=iso(d),items=tasks.filter(t=>t.date===key&&!t.start);return `<div>${items.map(t=>`<div class="week-unscheduled-item" data-task="${t.id}">${esc(t.title)}</div>`).join('')}</div>`}).join('')+'</div></div>';area.innerHTML=html;$$('[data-task]').forEach(el=>el.onclick=e=>{e.stopPropagation();openEdit(el.dataset.task)});$$('[data-date]').forEach(el=>el.onclick=()=>{selectedDate=el.dataset.date;update()});return}else{let first=new Date(base.getFullYear(),base.getMonth(),1),offset=(first.getDay()+6)%7,start=new Date(first);start.setDate(first.getDate()-offset);days=Array.from({length:42},(_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);return d})}let labels=['一','二','三','四','五','六','日'];let html='<div class="'+(mode==='week'?'week-grid':'month-grid')+'">'+labels.map(x=>`<div class="cal-cell cal-head">${x}</div>`).join('');days.forEach(d=>{let key=iso(d),dayItems=tasks.filter(t=>t.date===key).sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'));html+=`<div class="cal-cell ${key===selectedDate?'selected':''}" data-date="${key}"><div class="cal-daynum ${key===today?'today':''}">${d.getDate()}</div>${dayItems.slice(0,mode==='week'?4:3).map(t=>`<div class="cal-event ${!t.start?'todo':''} " data-task="${t.id}">${t.start?esc(t.start)+' ':''}${esc(t.title)}</div>`).join('')}${dayItems.length>(mode==='week'?4:3)?`<div class="cal-more">+${dayItems.length-(mode==='week'?4:3)} 項</div>`:''}</div>`});html+='</div>';area.innerHTML=html;$$('.cal-cell[data-date]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-task]')){openEdit(e.target.closest('[data-task]').dataset.task);return}selectedDate=el.dataset.date;update()});}
function taskHTML(t){let pc={high:'高',medium:'中',low:'低'}[t.priority];return `<div class="task ${t.done?'complete':''}" data-id="${esc(t.id)}"><button class="check ${t.done?'done':''}" data-id="${esc(t.id)}" aria-label="${t.done?'取消完成':'完成'}任務">${t.done?'✓':''}</button><div class="task-body"><div class="task-title">${esc(t.title)}</div><div class="task-details"><span class="tag">${esc(t.category||'未分類')}</span>${t.start?`<span>${t.start}${t.end?'–'+t.end:''}</span>`:''}<span class="priority ${esc(t.priority)}">● ${pc||''}</span></div></div><button class="task-delete" data-id="${esc(t.id)}" type="button" aria-label="刪除${esc(t.title)}">×</button></div>`}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dismissToast(){clearTimeout(toastTimer);toastTimer=null;$('#toast').classList.remove('show');$('#toast').replaceChildren()}
function toast(s){if(deletedTaskForUndo)return;dismissToast();$('#toast').textContent=s;$('#toast').classList.add('show');toastTimer=setTimeout(dismissToast,2200)}
function showUndoToast(task){dismissToast();const label=document.createElement('span'),button=document.createElement('button');label.textContent=`已刪除「${task.title}」`;button.type='button';button.className='toast-undo';button.textContent='復原';button.onclick=undoDeletedTask;$('#toast').append(label,button);$('#toast').classList.add('show');toastTimer=setTimeout(()=>{deletedTaskForUndo=null;dismissToast()},5000)}
function deleteTaskById(id){const index=tasks.findIndex(task=>task.id===id);if(index<0)return;const [task]=tasks.splice(index,1);deletedTaskForUndo={task,index};if(editingId===id)editingId=null;save();closeModal();update();showUndoToast(task)}
function undoDeletedTask(){if(!deletedTaskForUndo)return;const {task,index}=deletedTaskForUndo;deletedTaskForUndo=null;tasks.splice(Math.min(index,tasks.length),0,task);save();update();dismissToast()}
function refreshCategories(){let sel=$('#fCategory'),current=sel.value;sel.innerHTML='<option value="">未分類</option>'+categories.map(c=>`<option>${esc(c)}</option>`).join('');if(categories.includes(current))sel.value=current}
function minutes(value){if(!value)return null;const [h,m]=value.split(':').map(Number);return h*60+m}
function timeValue(value){const clamped=Math.min(23*60+59,value);return `${String(Math.floor(clamped/60)).padStart(2,'0')}:${String(clamped%60).padStart(2,'0')}`}
function rememberTimeDuration(){const start=minutes($('#fStart').value),end=minutes($('#fEnd').value);lastValidTimeDuration=start!==null&&end!==null&&end>start?end-start:null}
function adjustEndAfterStartChange(){const start=minutes($('#fStart').value);if(start===null){lastValidTimeDuration=null;return}const end=minutes($('#fEnd').value),duration=lastValidTimeDuration;let nextEnd;if(duration!==null)nextEnd=Math.min(1439,start+duration);else if(end===null||end<=start)nextEnd=Math.min(1439,start+60);else nextEnd=end;$('#fEnd').value=timeValue(nextEnd);rememberTimeDuration()}
function openModal(){editingId=null;lastValidTimeDuration=null;$('#taskForm').reset();$('#fDate').value=selectedDate;$('#fPriority').value='medium';$('#modalTitle').textContent='新增任務';$('#deleteTask').style.visibility='hidden';refreshCategories();$('#modalBackdrop').classList.add('open');setTimeout(()=>$('#fTitle').focus(),50)}
function openEdit(id){let t=tasks.find(x=>x.id===id);if(!t)return;editingId=id;$('#taskForm').reset();$('#modalTitle').textContent='編輯任務';$('#fTitle').value=t.title;refreshCategories();$('#fCategory').value=t.category||'';$('#fDate').value=t.date||'';$('#fStart').value=t.start||'';$('#fEnd').value=t.end||'';$('#fPriority').value=t.priority;$('#fNote').value=t.note||'';rememberTimeDuration();$('#deleteTask').style.visibility='visible';$('#modalBackdrop').classList.add('open')}
function closeModal(){$('#modalBackdrop').classList.remove('open')}
function openQuickDetails(){const draft=$('#quickTitle').value.trim();openModal();if(draft){$('#fTitle').value=draft;$('#quickTitle').value=''}}
$('#addTask').onclick=$('#quickDetails').onclick=openQuickDetails;$('#closeModal').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target===$('#modalBackdrop'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();setAccountMenuOpen(false)}});
$('#fStart').addEventListener('input',adjustEndAfterStartChange);$('#fStart').addEventListener('change',adjustEndAfterStartChange);$('#fEnd').addEventListener('input',rememberTimeDuration);$('#fEnd').addEventListener('change',rememberTimeDuration);
$('#taskForm').onsubmit=e=>{e.preventDefault();let title=$('#fTitle').value.trim();if(!title)return;let nc=$('#newCategory').value.trim();if(nc&&!categories.includes(nc)){categories.push(nc);save()}let category=nc||$('#fCategory').value;let item={id:editingId||crypto.randomUUID(),title,category,date:$('#fDate').value||selectedDate,start:$('#fStart').value,end:$('#fEnd').value,priority:$('#fPriority').value,note:$('#fNote').value.trim(),done:editingId?!!tasks.find(t=>t.id===editingId)?.done:false};if(item.start&&item.end&&item.end<item.start){toast('結束時間需晚於開始時間');return}if(editingId){tasks=tasks.map(t=>t.id===editingId?item:t);toast('任務已更新')}else{tasks.push(item);toast('任務已加入')}save();closeModal();update()};
$('#deleteTask').onclick=()=>{if(editingId)deleteTaskById(editingId)};
function quickAdd(){let title=$('#quickTitle').value.trim();if(!title){$('#quickTitle').focus();return}tasks.push({id:crypto.randomUUID(),title,category:'',date:selectedDate,start:'',end:'',priority:'medium',note:'',done:false});save();$('#quickTitle').value='';update();toast('已快速收進待辦')}
$('#quickTitle').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();quickAdd()}};
function toggleDone(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save();update();toast(tasks.find(t=>t.id===id).done?'做得好，任務完成！':'已移回待辦')}
$('#prevDay').onclick=()=>{let d=new Date(selectedDate+'T12:00:00');d.setDate(d.getDate()+(calendarView==='day'?-1:calendarView==='week'?-7:-new Date(d.getFullYear(),d.getMonth(),0).getDate()));selectedDate=iso(d);view='today';update()};$('#nextDay').onclick=()=>{let d=new Date(selectedDate+'T12:00:00');d.setDate(d.getDate()+(calendarView==='day'?1:calendarView==='week'?7:new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));selectedDate=iso(d);view='today';update()};$('#todayLink').onclick=()=>{selectedDate=today;view='today';filterType='';update()};$$('[data-calendar-view]').forEach(b=>b.onclick=()=>{calendarView=b.dataset.calendarView;$$('[data-calendar-view]').forEach(x=>x.classList.toggle('active',x===b));update()});
$$('.nav button[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;filterType='';if(view==='today')selectedDate=today;else selectedDate=today;$$('.nav button').forEach(x=>x.classList.toggle('active',x===b));update()});

$('#loginButton').onclick=async()=>{if(!isConfigured){showLoginGate('Firebase 尚未設定','使用 Google 登入',true);return}const button=$('#loginButton');button.disabled=true;try{if(currentUser)await handleAuthChange(currentUser);else await signInWithGoogle()}catch(e){showLoginGate('登入失敗，請重試。','使用 Google 登入',false);toast('登入失敗：'+e.message)}finally{if(!currentUser||cloudReadyUserId!==currentUser.uid)button.disabled=false}};

$('#avatarButton').onclick=()=>setAccountMenuOpen($('#accountMenu').hidden);$('#menuSignOut').onclick=async()=>{const button=$('#menuSignOut');button.disabled=true;setAccountMenuOpen(false);showLoginGate('正在儲存並登出…','處理中…',true);try{await flushPendingCloudSave();await signOutUser();resetToLogin()}catch(e){$('#appShell').hidden=false;$('#authGate').hidden=true;if(pendingCloudSave)save();toast('登出未完成：'+e.message)}finally{button.disabled=false}};document.addEventListener('click',e=>{if(!$('#accountArea').contains(e.target))setAccountMenuOpen(false)});
