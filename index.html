.timeline{position:relative;border-top:1px solid var(--line);padding-top:1px}.hour{height:65px;position:relative;border-bottom:1px solid #f0f2f0}.hour-label{position:absolute;top:-8px;left:0;font-size:10px;color:#a7b0ac;background:white;padding-right:9px}.hour-line{position:absolute;left:52px;right:0;top:0;border-top:1px solid #f0f2f0}.event{position:absolute;left:65px;right:3px;min-height:43px;border-left:3px solid var(--green);background:#ecf4ef;border-radius:5px;padding:8px 11px;display:flex;justify-content:space-between;align-items:center;z-index:2}.event.personal{border-color:var(--orange);background:#fbf0e9}.event.blue{border-color:var(--blue);background:#eef2f8}.event-title{font-size:11px;font-weight:600}.event-meta{font-size:9px;color:#84908a;margin-top:3px}.event-time{font-size:10px;color:#718079;white-space:nowrap}.now-line{position:absolute;left:52px;right:0;height:1px;background:#df805f;z-index:3}.now-line:before{content:'';position:absolute;left:-3px;top:-3px;width:7px;height:7px;background:#df805f;border-radius:50%}.schedule{margin-top:25px}
.rightbar{border-left:1px solid var(--line);padding:34px 23px;background:#fdfefd}.right-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.right-head h2{font-size:14px;margin:0}.text-btn{color:var(--green);background:none;font-size:11px;font-weight:600}.quick-box{border:1px solid #e6ece8;border-radius:12px;padding:14px;margin-bottom:24px;box-shadow:0 4px 14px #29473508}.quick-input{display:flex;gap:9px;align-items:center}.quick-input input{width:100%;border:0;outline:0;font-size:12px;color:var(--ink)}.quick-input input::placeholder{color:#aab3af}.quick-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding-top:11px;border-top:1px solid #f0f2f0}.quick-bottom span{font-size:10px;color:#a1aba6}.quick-bottom button{background:#edf4f0;color:var(--green);border-radius:7px;padding:6px 9px;font-size:10px;font-weight:600}.task-list{display:grid;gap:9px}.task{border:1px solid #edf0ed;border-radius:11px;padding:12px 12px 11px;display:grid;grid-template-columns:16px 1fr;gap:9px;background:#fff}.check{height:15px;width:15px;border:1.5px solid #d7dfd9;border-radius:5px;background:white;margin-top:1px;display:grid;place-items:center;color:white;font-size:10px}.check.done{background:#72a187;border-color:#72a187}.task-title{font-size:11px;font-weight:600;line-height:1.45}.task.complete .task-title{text-decoration:line-through;color:#a8b0ac}.task-details{display:flex;align-items:center;gap:7px;margin-top:7px;color:#929d98;font-size:9px}.tag{padding:3px 6px;border-radius:4px;background:#f0f4f1;color:#6f8b7b}.tag.orange{background:#fbf0e9;color:#bd7958}.priority{margin-left:auto}.priority.high{color:#d77457}.priority.medium{color:#d49b46}.priority.low{color:#7a9c87}.empty{color:#9aa49f;font-size:11px;text-align:center;padding:24px 8px}.later{margin-top:25px}.later-item{padding:11px 1px;border-bottom:1px solid #edf0ed;display:flex;justify-content:space-between;gap:8px}.later-item strong{font-size:10px;font-weight: border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;padding:7px 3px;font-size:10px;color:#7f8b85;position:sticky;top:0;z-index:3}.week-dayhead strong{display:block;font-size:12px;color:#384741;margin-top:3px}.week-dayhead.today strong{background:var(--green);color:white;border-radius:50%;width:21px;height:21px;line-height:21px;margin:2px auto 0}.week-daybody{height:780px;position:relative;border-right:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 64px,#f0f2f0 64px,#f0f2f0 65px)}.week-event{position:absolute;left:3px;right:3px;min-height:35px;padding:5px 5px;border-left:2px solid var(--green);border-radius:4px;background:#ecf4ef;z-index:2;overflow:hidden;cursor:pointer}.week-event .event-title{font-size:9px;line-height:1.35}.week-event .event-time{font-size:8px;margin-top:3px;color:#738079}.week-event.todo{position:relative;top:auto!important;left:auto;right:auto;margin:3px;min-height:0;padding:4px;border-color:#9cac9f;background:#f4f5f2}.week-unscheduled{padding:8px;border-top:1px solid var(--line);border-left:1px solid var(--line);font-size:10px;color:#77837d}.week-unscheduled strong{display:block;margin-bottom:6px;color:#53615a}.week-unscheduled-item{margin:4px 0;padding:4px;background:#f4f5f2;border-radius:4px;color:#59665f;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cal-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:110px;padding:7px 6px;cursor:pointer}.month-grid .cal-cell{min-height:95px}.cal-head{background:#fafcfa;min-height:auto;text-align:center;color:#89948e;font-size:10px;padding:8px 2px}.cal-daynum{font-size:10px;color:#7a8580;margin:0 0 5px 2px}.cal-daynum.today{background:var(--green);color:#fff;border-radius:50%;width:21px;height:21px;display:grid;place-items:center}.cal-event{font-size:9px;padding:4px 5px;margin:3px 0;background:#ebf3ee;border-left:2px solid var(--green);border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#42584b}.cal-event.personal{background:#fbf0e9;border-color:var(--orange)}.cal-event.todo{background:#f4f5f2;border-color:#9cac9f}.cal-cell.selected{background:#f5faf6}.cal-more{font-size:9px;color:#89948e;padding-left:4px}.modal-actions{display:flex;justify-content:space-between;margin-top:20px}.delete-btn{background:none;color:#c26b51;font-size:11px}.modal-actions .primary{padding:10px 18px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#243c32;color:white;border-radius:9px;padding:10px 15px;font-size:12px;transition:.25s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.app{grid-template-columns:210px minmax(460px,1fr)}.rightbar{grid-column:2;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:0 22px;padding:25px 35px}.rightbar>.right-head,.rightbar>.quick-box{grid-column:1/-1}.later{margin-top:0}}@media(max-width:760px){.app{display:block}.sidebar{display:none}main{padding:25px 18px 35px}.rightbar{display:block;padding:24px 18px}.cal-cell{min-height:75px;padding:4px}.cal-event{font-size:8px;padding:3px}.week-grid .cal-cell{min-height:70px}.heading-row h1{font-size:26px}.stats{gap:7px}.stat{padding:12px 10px}.event{left:57px}.hour-line,.now-line{left:45px}.hour-label{font-size:9px}.topline{margin-bottom:25px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}

<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-icon">◷</div><div><div class="brand-name">日序</div><div class="brand-sub">DAYFLOW</div></div></div>
  <div class="nav-label">工作空間</div>
  <nav class="nav"><button class="active" data-view="today"><span class="nav-icon">◷</span>行程總覽</button><button data-view="inbox"><span class="nav-icon">▤</span>所有任務<span class="nav-count" id="allCount">0</span></button></nav>
  <div class="nav-label">分類</div><nav class="nav" id="categoryNav"></nav>
  <div class="side-bottom"><div class="mini-date"><strong id="miniDate">今天</strong><p id="miniQuote">把重要的事，留給重要的時間。</p></div><div class="storage-note">資料僅儲存在這台裝置</div></div>
</aside>
<main>
  <div class="topline"><div class="crumb">工作空間　/　<b id="crumbText">今日安排</b></div><div class="top-actions"><button class="icon-btn" title="搜尋" id="searchBtn">⌕</button><button class="icon-btn" title="前往今天" id="jumpToday">⌂</button><div class="avatar">YU</div></div></div>
  <div class="greeting" id="greeting">THURSDAY, OCTOBER 30</div>
  <div class="heading-row"><div><h1 id="pageTitle">早安，今天也從容開始。</h1><p id="subtitle">理清節奏，為重要的事留出空間。</p></div><button class="primary" id="addTask"><span class="add-plus">＋</span>詳細新增</button></div>
  <section class="schedule"><div class="section-title"><h2 id="scheduleTitle">行程安排</h2><span>專注當下，也看見全貌</span></div><div class="daybar"><div class="date-control"><button class="date-arrow" id="prevDay">‹</button><strong id="displayDate"></strong><button class="date-arrow" id="nextDay">›</button><button class="today-link" id="todayLink">今天</button></div><div class="view-switch"><button data-calendar-view="day" class="active">日</button><button data-calendar-view="week">週</button><button data-calendar-view="month">月</button></div></div><div id="calendarArea"><div class="timeline" id="timeline"></div></div></section>
</main>
<aside class="rightbar">
  <div class="right-head"><h2 id="taskHeading">當日任務</h2><button class="text-btn" id="allTasksBtn">所有任務 →</button></div>
  <div class="quick-box"><div class="quick-input"><span style="color:#91a098">＋</span><input id="quickTitle" placeholder="新增任務，按 Enter 快速記下…" maxlength="100" /></div><div class="quick-bottom"><button id="quickAdd">快速新增</button><span>Enter 快速新增</span></div></div>
  <div><div class="right-head"><h2>任務清單</h2><button class="text-btn" id="sortBtn">優先度 ↓</button></div><div class="task-list" id="taskList"></div></div>
</aside>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h2 id="modalTitle">新增任務</h2><button class="close" id="closeModal">×</button></div><form id="taskForm"><div class="form-grid">
<div class="field full"><label for="fTitle">任務名稱 *</label><input id="fTitle" required maxlength="100" placeholder="例如：整理本週專案進度" /></div>
<div class="field"><label for="fCategory">分類</label><div class="category-controls"><select id="fCategory"><option value="">未分類</option></select><input id="newCategory" placeholder="＋ 新增分類" maxlength="20" /></div></div>
<div class="field"><label for="fDate">日期</label><input id="fDate" type="date" /></div>
<div class="field"><label>開始時間（選填）</label><div style="display:flex;gap:7px"><input id="fStart" type="time" aria-label="開始時間" /><input id="fEnd" type="time" aria-label="結束時間" /></div></div>
<div class="field"><label for="fPriority">優先度</label><select id="fPriority"><option value="medium">中</option><option value="high">高</option><option value="low">低</option></select></div>
<div class="field full"><label for="fNote">備註</label><textarea id="fNote" placeholder="補充說明、連結或想法…"></textarea></div>
</div><div class="modal-actions"><button type="button" class="delete-btn" id="deleteTask" style="visibility:hidden">刪除此任務</button><button type="submit" class="primary">儲存任務</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmtDate=(d,opts={weekday:'long',month:'long',day:'numeric'})=>new Intl.DateTimeFormat('zh-TW',opts).format(d);
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const today=iso(new Date());
const seed=[
{id:'s1',title:'整理本週產品進度',category:'產品專案',date:today,start:'09:30',end:'10:30',priority:'high',note:'整理本週成果與待確認項目',done:false},
{id:'s2',title:'回覆設計提案意見',category:'溝通協作',date:today,start:'11:00',end:'11:45',priority:'medium',note:'',done:false},
{id:'s3',title:'午餐與散步',category:'休息',date:today,start:'12:30',end:'13:30',priority:'low',note:'',done:false},
{id:'s4',title:'完成首頁介面檢視',category:'產品專案',date:today,start:'14:00',end:'15:30',priority:'high',note:'',done:false},
{id:'s5',title:'採買日用品',category:'生活',date:today,priority:'medium',note:'洗衣精、咖啡豆',done:false},
{id:'s6',title:'準備下週簡報素材',category:'產品專案',date:addDays(today,1),priority:'medium',note:'',done:false},
{id:'s7',title:'預約年度健康檢查',category:'生活',date:addDays(today,2),priority:'low',note:'',done:false}
];
function addDays(date,n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
let tasks;try{tasks=JSON.parse(localStorage.getItem('dayflow_tasks'))||seed}catch{tasks=seed}
let categories;try{categories=JSON.parse(localStorage.getItem('dayflow_categories'))||['產品專案','溝通協作','生活','休息']}catch{categories=['產品專案','溝通協作','生活','休息']}
let selectedDate=today,view='today',filterType='',editingId=null,searchMode=false,calendarView='day';
const save=()=>{localStorage.setItem('dayflow_tasks',JSON.stringify(tasks));localStorage.setItem('dayflow_categories',JSON.stringify(categories))};
const sortTasks=a=>a.sort((x,y)=>({high:0,medium:1,low:2}[x.priority]-({high:0,medium:1,low:2}[y.priority])||(x.start||'99:99').localeCompare(y.start||'99:99')));
function update(){
 const d=new Date(selectedDate+'T12:00:00');
 $('#greeting').textContent=fmtDate(d,{weekday:'long',month:'long',day:'numeric'}).toUpperCase();$('#displayDate').textContent=calendarView==='day'?fmtDate(d,{month:'long',day:'numeric',weekday:'short'}):calendarView==='week'?(()=>{let mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));let sun=new Date(mon);sun.setDate(mon.getDate()+6);return `${fmtDate(mon,{month:'short',day:'numeric'})} – ${fmtDate(sun,{month:'short',day:'numeric'})}`})():fmtDate(d,{year:'numeric',month:'long'});$('#miniDate').textContent=selectedDate===today?'今天，'+fmtDate(d,{month:'long',day:'numeric'}):fmtDate(d,{month:'long',day:'numeric'});
 const dayTasks=tasks.filter(t=>t.date===selectedDate),baseTasks=view==='inbox'?tasks:dayTasks,visible=filterType?(filterType==='__uncategorized'?baseTasks.filter(t=>!t.category):baseTasks.filter(t=>t.category===filterType)):baseTasks;
 
 $('#allCount').textContent=tasks.filter(t=>!t.done).length;renderCategoryNav();
 $('#taskHeading').textContent=view==='inbox'?(filterType?(filterType==='__uncategorized'?'未分類':'「'+filterType+'」')+'任務':'所有任務'):(selectedDate===today?'當日任務':'所選日期任務');
 $('#scheduleTitle').textContent=calendarView==='day'?'當日時間軸':calendarView==='week'?'每週行程':'每月行程';
 const area=$('#calendarArea');
 if(calendarView==='day'){
  area.innerHTML='<div class="timeline" id="timeline"></div>';$('#timeline').innerHTML=Array.from({length:12},(_,i)=>`<div class="hour"><span class="hour-label">${String(i+8).padStart(2,'0')}:00</span><div class="hour-line"></div></div>`).join('');
  visible.filter(t=>t.start).forEach(t=>{let [h,m]=t.start.split(':').map(Number),minute=h*60+m-480;if(minute<0||minute>=720)return;let end=t.end||t.start,[eh,em]=end.split(':').map(Number),dur=Math.max(40,eh*60+em-h*60-m),el=document.createElement('div');el.className='event '+'';el.style.top=(minute/60*65+1)+'px';el.style.height=Math.max(43,dur/60*65-4)+'px';el.innerHTML=`<div><div class="event-title">${esc(t.title)}</div><div class="event-meta">${esc(t.category||'未分類')}${t.note?' · '+esc(t.note):''}</div></div><div class="event-time">${t.start}${t.end?' – '+t.end:''}</div>`;el.title='點擊編輯';el.onclick=()=>openEdit(t.id);$('#timeline').append(el)});
  const now=new Date();if(selectedDate===today&&now.getHours()>=8&&now.getHours()<20){let line=document.createElement('div');line.className='now-line';line.style.top=((now.getHours()*60+now.getMinutes()-480)/60*65)+'px';$('#timeline').append(line)}
 }else renderCalendar(calendarView,area);
 const list=sortTasks(visible.filter(t=>!t.start));$('#taskList').innerHTML=list.length?list.map(taskHTML).join(''):'<div class="empty">這一天目前沒有未排時間的待辦。<br>快速收集一個想法吧 ✦</div>';
 $$('#taskList .check').forEach(b=>b.onclick=()=>toggleDone(b.dataset.id));$$('#taskList .task').forEach(el=>el.ondblclick=()=>openEdit(el.dataset.id));

 $('#pageTitle').textContent=view==='today'?(selectedDate===today?'早安，今天也從容開始。':fmtDate(d,{month:'long',day:'numeric'})+' 的安排'):filterType?filterType+'任務':'所有任務';$('#crumbText').textContent=view==='today'?'行程總覽':filterType?filterType+'任務':'所有任務';
}
function renderCategoryNav(){const nav=$('#categoryNav');if(!nav)return;nav.innerHTML=categories.map(c=>`<button data-filter="${esc(c)}" class="${filterType===c?'active':''}"><span class="nav-icon">◆</span>${esc(c)}<span class="nav-count">${tasks.filter(t=>t.category===c&&!t.done).length}</span></button>`).join('')+'<button data-filter="__uncategorized" class="'+(filterType==='__uncategorized'?'active':'')+'"><span class="nav-icon">◇</span>未分類</button>';$$('#categoryNav button').forEach(b=>b.onclick=()=>{filterType=b.dataset.filter==='__uncategorized'?'__uncategorized':b.dataset.filter;view='inbox';update()})}
function renderCalendar(mode,area){let base=new Date(selectedDate+'T12:00:00'),days=[];if(mode==='week'){let offset=(base.getDay()+6)%7;let monday=new Date(base);monday.setDate(base.getDate()-offset);days=Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(monday.getDate()+i);return d});let html='<div class="week-schedule"><div class="week-col"><div class="week-dayhead">時間</div>'+Array.from({length:12},(_,i)=>`<div class="week-time"><span>${String(i+8).padStart(2,'0')}:00</span></div>`).join('')+'</div>'+days.map(d=>{let key=iso(d),ev=tasks.filter(t=>t.date===key&&t.start).map(t=>{let [h,m]=t.start.split(':').map(Number),[eh,em]=(t.end||t.start).split(':').map(Number),top=(h*60+m-480)/60*65,height=Math.max(35,(eh*60+em-h*60-m)/60*65-3);if(top<0||top>780)return '';return `<div class="week-event" data-task="${t.id}" style="top:${top}px;height:${height}px"><div class="event-title">${esc(t.title)}</div><div class="event-time">${t.start}${t.end?'–'+t.end:''}</div></div>`}).join('');return `<div class="week-col"><div class="week-dayhead ${key===today?'today':''}" data-date="${key}">${['日','一','二','三','四','五','六'][d.getDay()]}<strong>${d.getDate()}</strong></div><div class="week-daybody" data-date="${key}">${ev}</div></div>`}).join('')+'</div><div class="week-unscheduled"><strong>未排時間的待辦</strong><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px">'+days.map(d=>{let key=iso(d),items=tasks.filter(t=>t.date===key&&!t.start);return `<div>${items.map(t=>`<div class="week-unscheduled-item" data-task="${t.id}">${esc(t.title)}</div>`).join('')}</div>`}).join('')+'</div></div>';area.innerHTML=html;$$('[data-task]').forEach(el=>el.onclick=e=>{e.stopPropagation();openEdit(el.dataset.task)});$$('[data-date]').forEach(el=>el.onclick=()=>{selectedDate=el.dataset.date;update()});return}else{let first=new Date(base.getFullYear(),base.getMonth(),1),offset=(first.getDay()+6)%7,start=new Date(first);start.setDate(first.getDate()-offset);days=Array.from({length:42},(_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);return d})}let labels=['一','二','三','四','五','六','日'];let html='<div class="'+(mode==='week'?'week-grid':'month-grid')+'">'+labels.map(x=>`<div class="cal-cell cal-head">${x}</div>`).join('');days.forEach(d=>{let key=iso(d),dayItems=tasks.filter(t=>t.date===key).sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'));html+=`<div class="cal-cell ${key===selectedDate?'selected':''}" data-date="${key}"><div class="cal-daynum ${key===today?'today':''}">${d.getDate()}</div>${dayItems.slice(0,mode==='week'?4:3).map(t=>`<div class="cal-event ${!t.start?'todo':''} " data-task="${t.id}">${t.start?esc(t.start)+' ':''}${esc(t.title)}</div>`).join('')}${dayItems.length>(mode==='week'?4:3)?`<div class="cal-more">+${dayItems.length-(mode==='week'?4:3)} 項</div>`:''}</div>`});html+='</div>';area.innerHTML=html;$$('.cal-cell[data-date]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-task]')){openEdit(e.target.closest('[data-task]').dataset.task);return}selectedDate=el.dataset.date;update()});}
function taskHTML(t){let pc={high:'高',medium:'中',low:'低'}[t.priority];return `<div class="task ${t.done?'complete':''}" data-id="${t.id}"><button class="check ${t.done?'done':''}" data-id="${t.id}" aria-label="完成任務">${t.done?'✓':''}</button><div><div class="task-title">${esc(t.title)}</div><div class="task-details"><span class="tag">${esc(t.category||'未分類')}</span>${t.start?`<span>${t.start}${t.end?'–'+t.end:''}</span>`:''}<span class="priority ${t.priority}">● ${pc}</span></div></div></div>`}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function refreshCategories(){let sel=$('#fCategory'),current=sel.value;sel.innerHTML='<option value="">未分類</option>'+categories.map(c=>`<option>${esc(c)}</option>`).join('');if(categories.includes(current))sel.value=current}
function openModal(){editingId=null;$('#taskForm').reset();$('#fDate').value=selectedDate;$('#fPriority').value='medium';$('#modalTitle').textContent='新增任務';$('#deleteTask').style.visibility='hidden';refreshCategories();$('#modalBackdrop').classList.add('open');setTimeout(()=>$('#fTitle').focus(),50)}
function openEdit(id){let t=tasks.find(x=>x.id===id);if(!t)return;editingId=id;$('#taskForm').reset();$('#modalTitle').textContent='編輯任務';$('#fTitle').value=t.title;refreshCategories();$('#fCategory').value=t.category||'';$('#fDate').value=t.date||'';$('#fStart').value=t.start||'';$('#fEnd').value=t.end||'';$('#fPriority').value=t.priority;$('#fNote').value=t.note||'';$('#deleteTask').style.visibility='visible';$('#modalBackdrop').classList.add('open')}
function closeModal(){$('#modalBackdrop').classList.remove('open')}
$('#addTask').onclick=()=>{let draft=$('#quickTitle').value.trim();openModal();if(draft){$('#fTitle').value=draft;$('#quickTitle').value=''}};$('#quickAdd').onclick=quickAdd;$('#closeModal').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target===$('#modalBackdrop'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#taskForm').onsubmit=e=>{e.preventDefault();let title=$('#fTitle').value.trim();if(!title)return;let nc=$('#newCategory').value.trim();if(nc&&!categories.includes(nc)){categories.push(nc);save()}let category=nc||$('#fCategory').value;let item={id:editingId||crypto.randomUUID(),title,category,date:$('#fDate').value||selectedDate,start:$('#fStart').value,end:$('#fEnd').value,priority:$('#fPriority').value,note:$('#fNote').value.trim(),done:editingId?!!tasks.find(t=>t.id===editingId)?.done:false};if(item.start&&item.end&&item.end<item.start){toast('結束時間需晚於開始時間');return}if(editingId){tasks=tasks.map(t=>t.id===editingId?item:t);toast('任務已更新')}else{tasks.push(item);toast('任務已加入')}save();closeModal();update()};
$('#deleteTask').onclick=()=>{if(editingId&&confirm('確定刪除此任務？')){tasks=tasks.filter(t=>t.id!==editingId);save();closeModal();update();toast('任務已刪除')}};
function quickAdd(){let title=$('#quickTitle').value.trim();if(!title){$('#quickTitle').focus();return}tasks.push({id:crypto.randomUUID(),title,category:'',date:selectedDate,start:'',end:'',priority:'medium',note:'',done:false});save();$('#quickTitle').value='';update();toast('已快速收進待辦')}
$('#quickTitle').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();quickAdd()}};
function toggleDone(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save();update();toast(tasks.find(t=>t.id===id).done?'做得好，任務完成！':'已移回待辦')}
$('#prevDay').onclick=()=>{let d=new Date(selectedDate+'T12:00:00');d.setDate(d.getDate()+(calendarView==='day'?-1:calendarView==='week'?-7:-new Date(d.getFullYear(),d.getMonth(),0).getDate()));selectedDate=iso(d);view='today';update()};$('#nextDay').onclick=()=>{let d=new Date(selectedDate+'T12:00:00');d.setDate(d.getDate()+(calendarView==='day'?1:calendarView==='week'?7:new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));selectedDate=iso(d);view='today';update()};$('#todayLink').onclick=$('#jumpToday').onclick=()=>{selectedDate=today;view='today';filterType='';update()};$$('[data-calendar-view]').forEach(b=>b.onclick=()=>{calendarView=b.dataset.calendarView;$$('[data-calendar-view]').forEach(x=>x.classList.toggle('active',x===b));update()});
$$('.nav button[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;filterType='';if(view==='today')selectedDate=today;else selectedDate=today;$$('.nav button').forEach(x=>x.classList.toggle('active',x===b));update()});

$('#allTasksBtn').onclick=()=>{$('[data-view="inbox"]').click()};$('#sortBtn').onclick=()=>toast('待辦依優先度排序');$('#searchBtn').onclick=()=>{if(!searchMode){searchMode=true;let q=prompt('搜尋任務名稱');if(q){let found=tasks.filter(t=>t.title.toLowerCase().includes(q.toLowerCase()));toast(found.length?`找到 ${found.length} 項任務`:'沒有找到符合的任務')}searchMode=false}else searchMode=false};
update();
})();
